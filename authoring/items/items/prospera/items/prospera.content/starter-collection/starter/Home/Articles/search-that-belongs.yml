    - ID: "6a728377-a363-455b-9de0-4fb6d0c19eb5"
      Hint: Content
      Value: "<p><code>articles-list-grid@1</code> can run three ways: composed placeholder children, a curated Treelist, or search when nested in a search experience.</p><p>This starter uses <strong>composed mode</strong>. Each card is an <code>article-card@1</code> in <code>cards-articles-*</code>, with its own title, excerpt, image, date, and link. Authors reorder and add cards in Pages without a query.</p><h2>When to switch</h2><p>When the catalog is large enough that hand-ordering is the bottleneck — filters, sort, and empty states start to matter — nest the same grid in a search experience and populate SearchConfig. The card rendering stays <code>article-card@1</code>. The listing page stays <code>page@1</code>.</p>"
