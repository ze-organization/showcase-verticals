    - ID: "6a728377-a363-455b-9de0-4fb6d0c19eb5"
      Hint: Content
      Value: <p>A <code>PageRecipe</code> declares handle, template, item path, fields, and placeholder placements. scai compiles that into item operations, plans against the tenant, and applies the plan on push.</p><h2>What the head app does</h2><p><code>npm run build</code> generates component maps and a Next.js bundle. It does not create <code>/Articles</code>. If a recipe is only on disk, the live site will not show it.</p><h2>What authors do next</h2><p>After the five samples exist, a new story does not need a sixth recipe. Insert Article under this folder, fill Title, ShortDescription, Content, and Image, and publish. Recipes seed the type; Pages grows the catalog.</p>
