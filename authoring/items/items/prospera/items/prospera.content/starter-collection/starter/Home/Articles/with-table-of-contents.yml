    - ID: cd287e6b-7bdc-48d1-9c82-f6646a9682c8
      Hint: Content
      Value: |
        <div class="ck-content"><p>Most new stories should still be <strong>Insert → Article</strong>. Add this type when the page should already ship a table of contents beside the body, without authors placing extra renderings.</p><h2>What the table of contents reads</h2><p>Entries come from the page <code>Content</code> field only. Headings in dropped placeholder blocks are ignored. Paragraphs never appear in the list.</p><h3>Heading levels</h3><p>Both <code>h2</code> and <code>h3</code> become entries, in document order. Nested <code>h3</code> rows indent under the previous section so the outline stays readable.</p><h3>Click, do not hash</h3><p>Choosing a row scrolls the matching heading into view. The URL does not gain a fragment the address bar stays the page path.</p><h2>Same shell as Article</h2><p>Lead image, share rail, title, dek, and the two drop zones stay. The only layout change is the body: table of contents on the left, rich text on the right. On small screens the list stacks above the body.</p><h2>When to insert this type</h2><p>Use <strong>Article with Table of Contents</strong> for long editorial pieces whose body is already structured with headings. Short news or promo stories can stay on Article.</p><h3>Insert under Articles</h3><p>The listing is still a marketing Page. After this type is pushed, set the listing item’s insert options so authors see both Article and Article with Table of Contents — not a blank Page.</p></div>
