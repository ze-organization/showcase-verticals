      Hint: Body
      Value: "<p>Add payees, set an amount and a date, and keep enough in everyday checking to cover them. Joint owners share the same payee list on a joint file.</p><p>For cash you want ring-fenced, label a savings goal and transfer to checking before the due date. Bill pay does not invent a second checking balance.</p><p><small>Prospera Bank, N.A., Member FDIC. Equal Housing Lender. Annual percentage yields (APY), annual percentage rates (APR), and fees shown on this site are illustrative for a demonstration and are not live offers.</small></p>"
