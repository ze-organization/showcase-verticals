    - ID: 6a728377-a363-455b-9de0-4fb6d0c19eb5
      Hint: Content
      Value: "<p>A site that adds a page template per URL cannot be authored. Editors lose the plot, insert options explode, and SEO fields get copied six different ways.</p><p>The starter keeps <strong>one marketing Page</strong> (<code>page@1</code>) for Home, listings, and generic URLs. That template already carries Title, Eyebrow, meta, Open Graph, Twitter, sitemap, and JSON-LD.</p><h2>When Article is worth a second template</h2><p>Create <code>article@1</code> when all three are true:</p><ul><li>Authors inserting under Articles should see <strong>Article</strong>, not Page.</li><li>A new article should already have the Article Details shell (image, share rail, body, two placeholders).</li><li>You still do not want article body fields on <code>page@1</code>.</li></ul><p>The page item carries Title, ShortDescription, Content, and Image. Extra blocks drop into <code>article-details-*</code> and <code>article-details-full-width-*</code>.</p>"
