    - ID: "6c269cbb-4f09-4531-9816-b3266829b8f3"
      Hint: Body
      Value: "<p>When you pay a merchant in another currency, Prospera does not add a foreign-transaction percentage in this demo. Dynamic currency conversion at the terminal is a merchant choice — decline it if you want the conversion on our statement instead.</p><p>Notify us of travel if your debit is declined abroad. Card lock and replacement follow everyday checking and Rewards Visa terms.</p><p><small>Prospera Bank, N.A., Member FDIC. Equal Housing Lender. Annual percentage yields (APY), annual percentage rates (APR), and fees shown on this site are illustrative for a demonstration and are not live offers.</small></p>"
