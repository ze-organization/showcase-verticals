      Value: |
        <div class="ck-content"><p>Home can offer <strong>Page</strong> and Redirect. Articles cannot reuse that list. A new story created there would inherit header and footer only — no article shell.</p><h2>What “enriched” means on insert</h2><p>The Article page design includes three partials:</p><ul><li>Header — Brand + Nav</li><li>Article Details — lead image, share rail, title, dek, body, plus <code>article-details-*</code> and <code>article-details-full-width-*</code></li><li>Footer — Link Columns</li></ul><p>Editors fill page fields. They do not restyle the type. A sixth article after these samples is <strong>Insert → Article</strong> under this listing, not another recipe file.</p></div>
