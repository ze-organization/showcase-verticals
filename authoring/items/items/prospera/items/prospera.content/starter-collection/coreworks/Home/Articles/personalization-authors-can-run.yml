    - ID: 6a728377-a363-455b-9de0-4fb6d0c19eb5
      Hint: Content
      Value: "<p>Teams often reach for a second article template the first time a campaign needs a different hero. That path ends in <em>Article — Campaign</em>, <em>Article — Partner</em>, and insert options nobody trusts.</p><p>Keep <code>article@1</code> as the type. Personalize the lead image, dek, or a block in <code>article-details-*</code> in Pages. The listing still points at one kind of child; search and sitemap still see articles.</p><h2>What stays on the type</h2><p>SEO fields, the Article Details partial, and insert options. What changes per visitor is a version of a rendering, not a new template.</p>"
